spring:
  application:
    name: payment-wallet-service

  profiles:
    active: local

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

      group:
        readiness:
          include:
            - readinessState
            - db
            - outboxBacklog

app:
  kafka:
    topics:
      payment-events: payment.events.v1
      wallet-events: wallet.events.v1
      shipment-events: shipment.events.v1
      outbox-dlq: payment-wallet.outbox.dlq.v1

  outbox:
    publisher:
      enabled: false
      batch-size: 50
      max-retries: 3
      retry-backoff: 2s
      poll-interval-ms: 1000

    health:
      enabled: true
      max-lag: 5m