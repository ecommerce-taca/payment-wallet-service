server:
  port: 8086

spring:
  datasource:
    url: jdbc:mysql://localhost:15405/paymentdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: payment_user
    password: payment_password

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000

    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:payment-wallet-service}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest

    listener:
      ack-mode: record

app:
  kafka:
    topics:
      payment-events: payment.events.v1
      wallet-events: wallet.events.v1
      shipment-events: shipment.events.v1
      outbox-dlq: payment-wallet.outbox.dlq.v1

    provisioning:
      enabled: ${KAFKA_TOPIC_PROVISIONING_GUARD_ENABLED:false}
      timeout: 10s

  outbox:
    publisher:
      enabled: true
      batch-size: 50
      max-retries: 3
      retry-backoff: 2s
      poll-interval-ms: 1000
      send-timeout-ms: 35000

    health:
      enabled: true
      max-lag: 5m

    cleanup:
      enabled: true
      retention: 7d
      batch-size: 500
      interval-ms: 3600000

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  payment-url: ${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:http://localhost:3000/payment/vnpay-return}