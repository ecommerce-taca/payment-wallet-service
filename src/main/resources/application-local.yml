server:
  port: 8086

spring:
  datasource:
    url: jdbc:mysql://localhost:15405/paymentdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: payment_user
    password: payment_password

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  payment-url: ${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:http://localhost:3000/payment/vnpay-return}